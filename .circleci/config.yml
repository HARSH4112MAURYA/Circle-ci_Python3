version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.8  # Use a CircleCI Python image
    steps:
      - checkout
      - run: python main.py

  test:
    docker:
      - image: cimg/python:3.8
    steps:
      - checkout
      - run: python test.py

  deploy:
    docker:
      - image: cimg/python:3.8
    steps:
      - run: echo "Practical done"

workflows:
  build_and_test_deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - deploy:
          requires:
            - test
          filters:
            branches:
              only: main
